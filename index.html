<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/main.css">

  <script src="https://kit.fontawesome.com/b9193f739e.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- .container>.purple+.white>art>(.bell>img)+(h1{You have 1 new message})+(.message-date>(.message>img)+.date>h2{Feb 22}+p{If you like what we do, please tell your friends and share.}).buttons>(.twitter>a)+.facebook>a -->


  <div class="container">
    <div class="purple"></div>
    <div class="white">
      <article>
        <div class="bell"><img src="img/bell.svg" alt="bell"></div>
        <h1>You have 1 new message</h1>
        <div class="message-date">
          <div class="message"><img src="img/poruka.svg" alt="poruka"></div>
          <div class="date">
            <h2>Feb 22</h2>
            <p>If you like what we do, please tell your friends and share.</p>
          </div>
        </div>
        <div class="buttons">
          <div class="twitter"><a href="#"> <i class="fa-brands fa-twitter fa-beat"></i> Twitter</a></div>
          <div class="facebook"><a href="#"><i class="fa-brands fa-facebook-f fa-beat"></i> Facebook</a></div>
        </div>
      </article>
    </div>
  </div>
</body>

</html>
